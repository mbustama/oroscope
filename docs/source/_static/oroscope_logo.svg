  <title id="ttl">Oroscope</title>
  <desc id="dsc">Circular badge. Two mountains in cross-section with detector stations across the terrain; a particle from a source above the horizon crosses the left massif, emerges from the rock and decays into an air shower that falls on the array in the valley.</desc>
