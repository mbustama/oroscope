name: tests

# Runs the suite on every supported Python. The names of these jobs are what the
# repository ruleset requires as status checks before main can be merged into, so
# renaming a job here means updating that ruleset too.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 added because `requires-python = ">=3.9"` has no upper bound, so pip
        # installs on it happily while nothing here had ever run it -- a user on 3.14
        # got an untested install that looked supported. The stack does not block it:
        # numba ships cp314 wheels and imagecodecs already requires >=3.12. Whether
        # *this* code is fine on it is what this leg is for; the classifier stays off
        # the list until this has actually passed.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run the suite
        # The suite is stdlib unittest, so it needs nothing beyond the package itself.
        # Run from tests/ because the modules put ../src on sys.path themselves and
        # discover the golden files relative to their own location.
        working-directory: tests
        run: python -m unittest discover -v

      - name: Measure coverage
        # One version only. Coverage is a property of the suite rather than of the
        # interpreter, so running it five times would upload five near-identical
        # reports and slow every job to gather them.
        if: matrix.python-version == '3.12'
        # From the repository root, not from tests/. `source = ["src"]` in
        # pyproject.toml is resolved against the working directory, so running this
        # from tests/ looks for tests/src, finds nothing, and reports "No data to
        # collect" while exiting successfully -- a green job measuring nothing. The
        # suite itself is location-independent: every module resolves src/ and the
        # golden files from its own __file__.
        run: |
          pip install coverage
          coverage run --rcfile=pyproject.toml -m unittest discover -s tests -t tests
          coverage report
          coverage xml -o coverage.xml

      - name: Keep the coverage report as an artifact
        # Uploaded to codecov by the separate `coverage` job below rather than from
        # inside the matrix. `if:` does not help here: a job downloads every action it
        # references during "Set up job", *before* any condition is evaluated, so
        # gating the step still made all five matrix legs fetch the codecov action for
        # a step four of them skip. That is what failed this workflow -- codeload
        # answered 429 to the fifth request and the 3.9 leg died in setup, having run
        # no tests at all. `fail_ci_if_error: false` could not save it either, because
        # the failure was the download, not the upload.
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 1

      - name: Confirm the package imports outside the source tree
        # Guards the packaging rather than the physics: an install that only works from
        # src/ would pass the suite above and fail for anyone who pip installs it.
        # Checks the package front door, the submodules, and that the console scripts
        # were actually installed -- three separate ways for packaging to go wrong.
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import oroscope; print(oroscope.__version__, len(oroscope.__all__), 'names')"
          python -c "import oroscope; oroscope.tau_decay_length_m(100.0); oroscope.default_config()"
          python -c "from oroscope import site_searcher, arrival_scan, physics, scoring, aperture"
          python -c "from oroscope import crop_dem, combine_experiments, sensitivity, explain"
          # A library must not choose its user's matplotlib backend.
          python -c "
          import matplotlib; before = matplotlib.get_backend()
          import oroscope
          assert matplotlib.get_backend() == before, 'importing oroscope changed the backend'
          "
          oroscope --help > /dev/null
          oroscope-crop --help > /dev/null
          oroscope-combine --help > /dev/null
          oroscope-sensitivity --help > /dev/null
          oroscope-fetch-dem --help > /dev/null

  # Split out of the matrix on purpose. Every action a job names is downloaded during
  # "Set up job", whatever its `if:` says, so keeping this inside the matrix made all
  # five interpreter legs fetch the codecov action to run it once -- and a 429 from
  # codeload then failed a leg that had not executed a single test. Here exactly one job
  # references it, and if codecov is having a bad day the interpreter matrix is untouched.
  coverage:
    name: Upload coverage
    needs: test
    runs-on: ubuntu-latest
    # Never a reason to call the code broken. The matrix above has already decided that.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: coverage-xml

      - uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
