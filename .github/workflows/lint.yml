name: Code Quality

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      # Rule selection is pinned in pyproject.toml rather than left to ruff's default,
      # which is not stable across releases.
      - run: ruff check .

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r docs/requirements.txt
      # -W turns warnings into errors. Switched on now that the docstring pass is
      # finished and numpydoc validation reports nothing: an undocumented parameter,
      # a broken cross-reference or an autodoc import failure should fail the build
      # rather than quietly produce a page with a hole in it.
      - run: sphinx-build -W -b html docs/source docs/build/html

  notebooks:
    name: Notebooks execute
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[notebooks]'
      - name: Execute every notebook
        # Blocking, and that is the point of the job. A notebook is documentation
        # claiming to work. Its stored outputs make the claim persuasive without being
        # evidence: they were true whenever it was last run, which may predate the API
        # change that broke it. Running them here is what makes the claim checkable.
        #
        # Executed into a throwaway copy rather than in place, because a notebook whose
        # fresh outputs differ from its stored ones is not a failure -- figures are not
        # reproducible bit-for-bit across matplotlib versions -- so nothing is written
        # back and the working tree stays clean.
        #
        # 07, 08 and 09 are excluded. 07 and 08 drive the whole pipeline rather than the
        # kernels, and 08 reads stored full-DEM results that take about half an hour
        # each to produce and are not in a runner's filesystem anyway. 09 builds eight
        # animations: two minutes of rendering, three of them running full arrival scans
        # per frame, and it needs an ffmpeg the runner does not have. Executing any of
        # them on every push would cost more than it checks. They are run locally when a
        # configuration changes and their outputs are committed; test_docs.py checks
        # that the API names they call still exist, which is the drift that mattered.
        run: |
          mkdir -p /tmp/nbcheck
          cp notebooks/*.ipynb /tmp/nbcheck/
          rm -f /tmp/nbcheck/07_explaining_a_run.ipynb
          rm -f /tmp/nbcheck/08_the_full_dem.ipynb
          rm -f /tmp/nbcheck/09_animating_the_mechanism.ipynb
          cd /tmp/nbcheck
          jupyter nbconvert --to notebook --execute --inplace *.ipynb
