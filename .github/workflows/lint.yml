name: Code Quality

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      # Rule selection is pinned in pyproject.toml rather than left to ruff's default,
      # which is not stable across releases.
      - run: ruff check .

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r docs/requirements.txt
      # -W turns warnings into errors. Switched on now that the docstring pass is
      # finished and numpydoc validation reports nothing: an undocumented parameter,
      # a broken cross-reference or an autodoc import failure should fail the build
      # rather than quietly produce a page with a hole in it.
      - run: sphinx-build -W -b html docs/source docs/build/html
